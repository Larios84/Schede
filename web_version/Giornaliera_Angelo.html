<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scheda Intervento - Angelo</title>
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #e3f2fd; margin: 0; padding: 10px; display: flex; justify-content: center; }
        .container { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.15); width: 100%; max-width: 500px; }
        h2 { text-align: center; color: #0d47a1; margin-top: 0; }
        .row { display: flex; gap: 10px; margin-bottom: 10px; }
        .field { flex: 1; display: flex; flex-direction: column; }
        label { font-size: 12px; font-weight: bold; margin-bottom: 3px; color: #444; }
        select, input, textarea { padding: 8px; border: 1px solid #bbb; border-radius: 6px; font-size: 14px; outline: none; }
        .activity-box { border: 2px solid #1976d2; padding: 10px; border-radius: 8px; margin-top: 15px; background: #e3f2fd; }
        button { padding: 10px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 13px; }
        .btn-add { background: #1976d2; color: white; width: 100%; margin-top: 8px; }
        .btn-pulisci { background: #dc3545; color: white; width: 100%; margin-top: 8px; }
        .btn-pdf { background: #ff9800; color: white; width: 100%; margin-top: 15px; font-size: 16px; height: 45px; }
        .btn-storico { background: #6c757d; color: white; width: 100%; margin-top: 8px; }
        .btn-ieri { background: #607d8b; color: white; width: 100%; margin-top: 10px; }
        
        /* Media query per schermi piccoli */
        @media (max-width: 480px) {
            body { padding: 5px; }
            .container { padding: 10px; max-width: 100%; }
            .row { gap: 8px; margin-bottom: 8px; }
            select, input, textarea { padding: 6px; font-size: 13px; }
            .activity-box { padding: 8px; margin-top: 10px; }
            button { padding: 8px; font-size: 12px; }
            .btn-pdf { height: 40px; font-size: 14px; margin-top: 10px; }
        }

    </style>
</head>
<body>


<div class="container">
    <h2>S</h2>
    <div class="row">
        <div class="field"><label>OPERATORE</label><input type="text" id="nome" value="Angelo Boi" readonly style="background:#eee"></div>
        <div class="field"><label>DATA</label><input type="date" id="data"></div>
    </div>
    <div class="row">
        <div class="field"><label>REPARTO</label><select id="reparto">
            <option value="TEC">IMP.TECNOLOGICI</option>
            <option value="AVL">AVL</option>
            <option value="BHS">BHS</option>
            <option value="ELETTR">IMP.ELETTRICI</option>
            <option value="SPEC">IMP.SPECIALI</option>
            <option value="GEN">MAN.GEN</option>
            <option value="STP">STP VERDE</option>
        </select></div>
        <div class="field"><label>TURNO</label><select id="turno">
            <option>6</option><option>7</option><option>14</option>
            <option>6d</option><option>7d</option><option>14d</option>
            <option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>5.48</option>
            <option>6+</option><option>6.48</option><option>7+</option><option>8</option><option>9</option><option>13</option>
            <option>13+</option><option>13.48</option><option>14.48</option><option>15</option><option>21+</option><option>21.48</option><option>22</option>
        </select></div>
    </div>

    <div class="activity-box">
        <div class="field" style="margin-bottom: 10px;">
            <label>NUOVA ATTIVITÀ</label>
            <textarea id="desc" placeholder="Descrizione del lavoro..." rows="2"></textarea>
        </div>
        <div class="row" style="margin-top:10px; margin-bottom:10px">
            <div class="field"><label>ORE</label><input type="number" id="ore" placeholder="Opzionale" step="0.1"></div>
        </div>
        <div class="row" style="margin-bottom:0">
            <div style="flex:1; display: flex; gap: 10px;">
                <button class="btn-add" onclick="aggiungiAttivita()">AGGIUNGI</button>
                <button class="btn-pulisci" onclick="pulisciCampi()">PULISCI</button>
            </div>
        </div>
    </div>

    <div id="listaAttivita" style="margin-top: 15px;"></div>

    <div style="margin-top: 20px; padding: 15px; border: 1px solid #ddd; border-radius: 8px; background: #fafafa;">
        <div class="field">
            <label>ORE STRAORDINARIO</label>
            <input type="number" id="inputStraordinario" value="0" step="0.1" oninput="aggiornaTotale()">
        </div>
    </div>

    <div class="totals"><div>Totale ore: <span id="totaleDisplay">7,42</span></div></div>

    <button class="btn-ieri" onclick="caricaComeIeri()">CARICA COME IERI</button>
    <button class="btn-pdf" onclick="generaPDF()">GENERA PDF E SALVA</button>
    <button class="btn-storico" id="btnToggleStorico" onclick="toggleStorico()">MOSTRA STORICO GOOGLE</button>
    <div id="status-caricamento" class="loading-text"></div>
    <div id="storico-container"><h3>I Tuoi Interventi (Angelo)</h3><table id="storico-table"><thead><tr><th>Data</th><th>Reparto</th><th>Turno</th><th>Ore</th></tr></thead><tbody></tbody></table></div>
</div>

const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwa5cZnejXKZ_cV0CtyyXLiAUlIdiD9_U2NeSdmXH6K7WCBt8mkBLslY6flH1SXlbz5hA/exec";
const UTENTE_CORRENTE = "Angelo Boi";
let attivita = [];
let datiStorico = [];

document.getElementById('data').valueAsDate = new Date();
aggiornaDatiGoogle();

function aggiornaTotale() {
    const stra = parseFloat(document.getElementById('inputStraordinario').value) || 0;
    const tot = 7.42 + stra;
    document.getElementById('totaleDisplay').innerText = tot.toFixed(2).replace('.', ',');
}

function formattaTurno(val) {
    if (!val) return "";
    let s = val.toString();
    if (s.includes('T')) {
        const d = new Date(s);
        return d.getHours() + "." + d.getMinutes().toString().padStart(2, '0');
    }
    return s;
}

function aggiungiAttivita() {
    const desc = document.getElementById('desc').value.trim();
    const ore = document.getElementById('ore').value.trim();
    if (!desc) return alert("Inserisci una descrizione!");
    attivita.push({ desc, ore });
    document.getElementById('desc').value = '';
    document.getElementById('ore').value = '';
    renderLista();
}

function pulisciCampi() { document.getElementById('desc').value = ''; document.getElementById('ore').value = ''; }

function renderLista() {
    const lista = document.getElementById('listaAttivita');
    let html = '';
    attivita.forEach((a, i) => {
        const oreStr = a.ore ? ' - ' + a.ore.replace('.', ',') + 'h' : '';
        html += '<div class="list-item" onclick="modificaAttivita(' + i + ')">' + a.desc + oreStr + '</div>';
    });
    lista.innerHTML = html;
}

function modificaAttivita(i) {
    const att = attivita[i];
    document.getElementById('desc').value = att.desc;
    document.getElementById('ore').value = att.ore;
    attivita.splice(i, 1);
    renderLista();
}

function toggleStorico() { const container = document.getElementById('storico-container'); const btn = document.getElementById('btnToggleStorico'); if (container.style.display === 'none' || container.style.display === '') { container.style.display = 'block'; btn.innerText = "NASCONDI STORICO"; aggiornaDatiGoogle(); } else { container.style.display = 'none'; btn.innerText = "MOSTRA STORICO GOOGLE"; } }

async function generaPDF() {
    if (!template_ab_b64) return alert("Errore: Il template Base64 non è configurato!");
    const nome = UTENTE_CORRENTE;
    const dataInput = document.getElementById('data').value;
    if(!dataInput) return alert("Seleziona una data!");
    const dataStr = dataInput.split('-').reverse().join('/');

    const straordinario = parseFloat(document.getElementById('inputStraordinario').value) || 0;
    const totOre = 7.42 + straordinario;

    const dati = {
        nome,
        data: dataStr,
        reparto: document.getElementById('reparto').value,
        turno: document.getElementById('turno').value,
        oreTotali: totOre,
        straordinario: straordinario,
        attivita: JSON.stringify(attivita.map(a => ({ first: a.desc, second: a.ore })))
    };

    try {
        const { PDFDocument } = PDFLib;
        const pdfDoc = await PDFDocument.load(template_ab_b64);
        const form = pdfDoc.getForm();
        const mapReparto = { "AVL": "avl", "BHS": "bhs", "TEC": "tec", "ELETTR": "elettr", "SPEC": "spec", "GEN": "gen", "STP": "stp" };

        Object.keys(mapReparto).forEach(k => {
            try {
                const field = form.getField(mapReparto[k]);
                if (k === dati.reparto) field.check(); else field.uncheck();
            } catch(e){}
        });

        try { form.getTextField('nome').setText(dati.nome); } catch(e){}
        try { form.getTextField('data').setText(dati.data); } catch(e){}
        try { form.getTextField('turno').setText(dati.turno); } catch(e){}
        try { form.getTextField('tot').setText("7,42"); } catch(e){} // Scrive sempre 7,42 come base
        if (dati.straordinario > 0) {
            try { form.getTextField('str').setText(dati.straordinario.toFixed(2).replace('.', ',')); } catch(e){}
            // Il totale nel PDF deve essere 7,42 + straordinario?
            // Se sì, sovrascrivo 'tot'
            try { form.getTextField('tot').setText(dati.oreTotali.toFixed(2).replace('.', ',')); } catch(e){}
        }

        const attList = JSON.parse(dati.attivita);
        attList.forEach((a, i) => {
            if (i < 8) {
                const rowNum = i + 1;
                const fieldName = rowNum === 2 ? "att2_2" : (rowNum === 8 ? "att2" : "att" + rowNum);
                try { form.getTextField(fieldName).setText(a.first); } catch(e){}
                try { form.getTextField("ore" + rowNum).setText(a.second ? a.second.replace('.', ',') : ""); } catch(e){}
            }
        });

        form.flatten();
        const pdfBytes = await pdfDoc.save();
        const blob = new Blob([pdfBytes], { type: "application/pdf" });

        // Uniformo il nome file: AAAAMMGG Nome.pdf
        const dateParts = dati.data.split('/');
        const formattedDate = dateParts[2] + dateParts[1] + dateParts[0];
        const fileName = formattedDate + ' ' + dati.nome + '.pdf';

        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = fileName;
        link.click();

        await salvaSuGoogle(dati);
        alert("PDF Creato!");
        attivita = [];
        renderLista();
        document.getElementById('inputStraordinario').value = 0;
        aggiornaTotale();
        setTimeout(aggiornaDatiGoogle, 3000);
    } catch (error) { alert("Errore generazione: " + error.message); }
}

async function salvaSuGoogle(dati) {
    // Utilizziamo lo stesso SCRIPT_URL ma con i dati di Angelo
    await fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(dati) });
}

function caricaComeIeri() {
    if (datiStorico.length === 0) return alert("Storico non caricato!");
    const ieri = new Date(); ieri.setDate(ieri.getDate() - 1);
    const ieriStr = ieri.toLocaleDateString('it-IT');
    const interventoIeri = datiStorico.find(row => {
        let d = row.data.toString();
        if (d.includes('T')) d = new Date(d).toLocaleDateString('it-IT');
        return d === ieriStr;
    });
    if (!interventoIeri) return alert("Nessun intervento per ieri!");
    document.getElementById('reparto').value = interventoIeri.reparto;
    document.getElementById('turno').value = formattaTurno(interventoIeri.turno);
    if (interventoIeri.attivita || interventoIeri.attivitaJson) {
        try {
            attivita = JSON.parse(interventoIeri.attivita || interventoIeri.attivitaJson).map(a => ({ desc: a.first, ore: a.second }));
            renderLista();
        } catch (e) {}
    }
    document.getElementById('inputStraordinario').value = interventoIeri.straordinario || 0;
    aggiornaTotale();
}

async function aggiornaDatiGoogle() {
    const status = document.getElementById('status-caricamento');
    status.innerText = "Sincronizzazione...";
    try {
        const response = await fetch(SCRIPT_URL + '?action=read&t=' + new Date().getTime());
        let result = await response.json();
        datiStorico = (Array.isArray(result) ? result : result.data).filter(row => row.nome === UTENTE_CORRENTE);
        const tbody = document.querySelector('#storico-table tbody');
        tbody.innerHTML = '';
        datiStorico.forEach(row => {
            let dataDisp = row.data.includes('T') ? new Date(row.data).toLocaleDateString('it-IT') : row.data;
            let turnoDisp = formattaTurno(row.turno);
            const tr = document.createElement('tr');
            tr.className = 'clickable-row';
            tr.innerHTML = `<td>${dataDisp}</td><td>${row.reparto}</td><td>${turnoDisp}</td><td>${row.oreTotali}h</td>`;
            tr.onclick = () => {
                if(confirm("Caricare questo intervento?")) {
                    document.getElementById('reparto').value = row.reparto;
                    document.getElementById('turno').value = turnoDisp;
                    try {
                        attivita = JSON.parse(row.attivita || row.attivitaJson).map(a => ({ desc: a.first, ore: a.second }));
                        renderLista();
                    } catch (e){}
                    document.getElementById('inputStraordinario').value = row.straordinario || 0;
                    aggiornaTotale();
                    window.scrollTo(0,0);
                }
            };
            tbody.appendChild(tr);
        });
        status.innerText = "Dati aggiornati.";
    } catch (error) { status.innerText = "Errore sincronizzazione."; }
}
