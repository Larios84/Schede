<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scheda Intervento - Luca</title>
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #e8f5e9; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.15); width: 100%; max-width: 600px; }
        h2 { text-align: center; color: #1b5e20; margin-top: 0; }
        .row { display: flex; gap: 15px; margin-bottom: 15px; }
        .field { flex: 1; display: flex; flex-direction: column; }
        label { font-size: 13px; font-weight: bold; margin-bottom: 5px; color: #444; }
        select, input, textarea { padding: 12px; border: 1px solid #bbb; border-radius: 6px; font-size: 15px; outline: none; }
        .activity-box { border: 2px solid #2e7d32; padding: 15px; border-radius: 8px; margin-top: 20px; background: #f1f8e9; }
        button { padding: 12px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .btn-add { background: #2e7d32; color: white; width: 100%; margin-top: 10px; }
        .btn-pulisci { background: #dc3545; color: white; width: 100%; margin-top: 10px; }
        .btn-pdf { background: #1976d2; color: white; width: 100%; margin-top: 25px; font-size: 18px; height: 50px; }
        .btn-storico { background: #6c757d; color: white; width: 100%; margin-top: 10px; }
        .list-item { background: #fff; padding: 12px; border: 1px solid #ddd; margin-top: 8px; display: flex; justify-content: space-between; border-radius: 6px; cursor: pointer; }
        .totals { text-align: right; margin-top: 15px; font-size: 18px; border-top: 2px solid #eee; padding-top: 10px; }
        #storico-container { display: none; margin-top: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #2e7d32; color: white; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        tr.clickable-row { cursor: pointer; }
        tr.clickable-row:hover { background-color: #e8f5e9 !important; }
        .loading-text { font-style: italic; color: #888; font-size: 12px; }
        .btn-ieri { background: #ff9800; color: white; width: 100%; margin-top: 15px; }

        /* Schermata di Login */
        #login-overlay { position:fixed; top:0; left:0; width:100%; height:100%; background:#e8f5e9; z-index:9999; display:flex; flex-direction:column; align-items:center; justify-content:center; }
        .login-box { background:white; padding:40px; border-radius:15px; box-shadow:0 10px 30px rgba(0,0,0,0.1); text-align:center; }
        .login-box input { width: 250px; margin-bottom: 20px; text-align: center; }
        .login-box button { background:#2e7d32; color:white; width: 100%; }
    </style>
</head>
<body>

<!-- Box di Accesso -->
<div id="login-overlay">
    <div class="login-box">
        <h2 style="color:#2e7d32; margin-bottom:20px;">Accesso Riservato</h2>
        <p style="margin-bottom:20px; color:#666;">Inserisci la password per Luca</p>
        <input type="password" id="pass-input" placeholder="Password">
        <button onclick="checkPass()">ACCEDI</button>
        <p id="error-msg" style="color:red; margin-top:15px; display:none;">Password errata!</p>
    </div>
</div>

<div class="container">
    <h2>Schede di Luca</h2>
    <div class="row">
        <div class="field"><label>OPERATORE</label><input type="text" id="nome" value="Garau Luca" readonly style="background:#eee"></div>
        <div class="field"><label>DATA</label><input type="date" id="data"></div>
    </div>
    <div class="row">
        <div class="field"><label>REPARTO</label><select id="reparto"><option value="AVL">AVL</option><option value="BHS">BHS</option><option value="TEC">IMP.TECNOLOGICI</option><option value="ELETTR">IMP.ELETTRICI</option><option value="SPEC">IMP.SPECIALI</option><option value="GEN">MAN.GEN</option><option value="STP">STP VERDE</option></select></div>
        <div class="field"><label>TURNO</label><select id="turno"><option>5.48</option><option>6</option><option>6+</option><option>6.48</option><option>7</option><option>7+</option><option>13</option><option>13+</option><option>13.48</option><option { value: "14" }>14</option><option>14.48</option><option>15</option><option>21+</option><option>21.48</option><option>22</option></select></div>
    </div>
    <div class="activity-box">
        <div class="field" style="margin-bottom: 10px;">
            <label>NUOVA ATTIVITÀ</label>
            <textarea id="desc" placeholder="Descrizione del lavoro..." rows="2"></textarea>
        </div>
        <div class="row" style="margin-top:10px; margin-bottom:0"><div class="field"><input type="number" id="ore" placeholder="Ore" step="0.1"></div><div style="flex:1; display: flex; gap: 10px;"><button class="btn-add" onclick="aggiungiAttivita()">AGGIUNGI</button><button class="btn-pulisci" onclick="pulisciCampi()">PULISCI</button></div></div>
    </div>
    <div id="listaAttivita"></div>
    <div class="totals"><div>Totale ore: <span id="totale">0,00</span></div></div>
    <button class="btn-ieri" onclick="caricaComeIeri()">CARICA COME IERI</button>
    <button class="btn-pdf" onclick="generaPDF()">GENERA PDF E SALVA</button>
    <button class="btn-storico" id="btnToggleStorico" onclick="toggleStorico()">MOSTRA STORICO GOOGLE</button>
    <div id="status-caricamento" class="loading-text"></div>
    <div id="storico-container"><h3>I Tuoi Interventi (Luca)</h3><table id="storico-table"><thead><tr><th>Data</th><th>Reparto</th><th>Turno</th><th>Ore</th></tr></thead><tbody></tbody></table></div>
</div>

<script>
// --- GESTIONE PASSWORD ---
function checkPass() {
    const input = document.getElementById('pass-input').value;
    if (btoa(input) === "TW9uc3RlcjY5Ng==") {
        document.getElementById('login-overlay').style.display = 'none';
    } else {
        document.getElementById('error-msg').style.display = 'block';
        document.getElementById('pass-input').value = "";
    }
}
document.getElementById('pass-input').addEventListener('keypress', function(e) { if(e.key === 'Enter') checkPass(); });

const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwa5cZnejXKZ_cV0CtyyXLiAUlIdiD9_U2NeSdmXH6K7WCBt8mkBLslY6flH1SXlbz5hA/exec";
const UTENTE_CORRENTE = "Garau Luca";
let attivita = [];
let datiStorico = [];

document.getElementById('data').valueAsDate = new Date();
aggiornaDatiGoogle();

function formattaTurno(val) {
    if (!val) return "";
    let s = val.toString();
    if (s.includes('T')) {
        const d = new Date(s);
        return d.getHours() + "." + d.getMinutes().toString().padStart(2, '0');
    }
    return s;
}

function aggiungiAttivita() { const desc = document.getElementById('desc').value.trim(); const ore = parseFloat(document.getElementById('ore').value) || 0; if (!desc) return alert("Inserisci una descrizione!"); if (ore <= 0) return alert("Inserisci un numero di ore valido!"); attivita.push({ desc, ore }); document.getElementById('desc').value = ''; document.getElementById('ore').value = ''; renderLista(); }
function pulisciCampi() { document.getElementById('desc').value = ''; document.getElementById('ore').value = ''; }
function renderLista() { const lista = document.getElementById('listaAttivita'); let html = ''; let tot = 0; attivita.forEach((a, i) => { tot += a.ore; const oreStr = a.ore.toFixed(2).replace('.', ','); html += '<div class="list-item" onclick="modificaAttivita(' + i + ')">' + a.desc + ' - ' + oreStr + 'h</div>'; }); lista.innerHTML = html; document.getElementById('totale').innerText = tot.toFixed(2).replace('.', ','); }
function modificaAttivita(i) { const att = attivita[i]; document.getElementById('desc').value = att.desc; document.getElementById('ore').value = att.ore.toString().replace('.', ','); attivita.splice(i, 1); renderLista(); }
function toggleStorico() { const container = document.getElementById('storico-container'); const btn = document.getElementById('btnToggleStorico'); if (container.style.display === 'none' || container.style.display === '') { container.style.display = 'block'; btn.innerText = "NASCONDI STORICO"; aggiornaDatiGoogle(); } else { container.style.display = 'none'; btn.innerText = "MOSTRA STORICO GOOGLE"; } }

async function generaPDF() {
    if (attivita.length === 0) return alert("Inserisci almeno un'attività!");
    if (!template_lg_b64) return alert("Devi incollare il codice Base64 nel file!");
    const nome = UTENTE_CORRENTE;
    const dataInput = document.getElementById('data').value;
    if(!dataInput) return alert("Seleziona una data!");
    const dataStr = dataInput.split('-').reverse().join('/');
    let totOre = 0;
    attivita.forEach(a => totOre += a.ore);
    if (totOre < 7.5 && !confirm("Ore totali minori di 7,5. Continuare?")) return;
    const str = totOre > 7.5 ? totOre - 7.5 : 0;
    const dati = { nome, data: dataStr, reparto: document.getElementById('reparto').value, turno: document.getElementById('turno').value, oreTotali: totOre, straordinario: str, attivita: JSON.stringify(attivita.map(a => ({ first: a.desc, second: a.ore.toString() }))) };

    try {
        const { PDFDocument } = PDFLib;
        const pdfDoc = await PDFDocument.load(template_lg_b64);
        const form = pdfDoc.getForm();
        const mapReparto = { "AVL": "avl", "BHS": "bhs", "TEC": "tec", "ELETTR": "elettr", "SPEC": "spec", "GEN": "gen", "STP": "stp" };
        Object.keys(mapReparto).forEach(k => { try { const field = form.getField(mapReparto[k]); if (k === dati.reparto) field.check(); else field.uncheck(); } catch(e){} });
        try { form.getTextField('nome').setText(dati.nome); } catch(e){}
        try { form.getTextField('data').setText(dati.data); } catch(e){}
        try { form.getTextField('turno').setText(dati.turno); } catch(e){}
        try { form.getTextField('tot').setText(dati.oreTotali.toFixed(2).replace('.', ',')); } catch(e){}
        try { form.getTextField('str').setText(dati.straordinario > 0 ? dati.straordinario.toFixed(2).replace('.', ',') : ""); } catch(e){}
        const attList = JSON.parse(dati.attivita);
        attList.forEach((a, i) => { if (i < 8) { const rowNum = i + 1; const fieldName = rowNum === 2 ? "att2_2" : (rowNum === 8 ? "att2" : "att" + rowNum); try { form.getTextField(fieldName).setText(a.first); } catch(e){} try { form.getTextField("ore" + rowNum).setText(a.second.replace('.', ',')); } catch(e){} } });
        form.flatten();
        const pdfBytes = await pdfDoc.save();
        const blob = new Blob([pdfBytes], { type: "application/pdf" });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = dati.nome + ' ' + dati.data.replace(/\//g, '-') + '.pdf';
        link.click();
        await salvaSuGoogle(dati);
        alert("PDF Creato!");
        attivita = [];
        renderLista();
        setTimeout(aggiornaDatiGoogle, 3000);
    } catch (error) { alert("Errore generazione: " + error.message); }
}

async function salvaSuGoogle(dati) { await fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(dati) }); }
function caricaComeIeri() { if (datiStorico.length === 0) return alert("Storico non caricato!"); const ieri = new Date(); ieri.setDate(ieri.getDate() - 1); const ieriStr = ieri.toLocaleDateString('it-IT'); const interventoIeri = datiStorico.find(row => { let d = row.data.toString(); if (d.includes('T')) d = new Date(d).toLocaleDateString('it-IT'); return d === ieriStr; }); if (!interventoIeri) return alert("Nessun intervento per ieri!"); document.getElementById('reparto').value = interventoIeri.reparto; document.getElementById('turno').value = formattaTurno(interventoIeri.turno); if (interventoIeri.attivita || interventoIeri.attivitaJson) { try { attivita = JSON.parse(interventoIeri.attivita || interventoIeri.attivitaJson).map(a => ({ desc: a.first, ore: parseFloat(a.second.replace(',', '.')) })); renderLista(); } catch (e) {} } }
async function aggiornaDatiGoogle() { const status = document.getElementById('status-caricamento'); status.innerText = "Sincronizzazione..."; try { const response = await fetch(SCRIPT_URL + '?action=read&t=' + new Date().getTime()); let result = await response.json(); datiStorico = (Array.isArray(result) ? result : result.data).filter(row => row.nome === UTENTE_CORRENTE); const tbody = document.querySelector('#storico-table tbody'); tbody.innerHTML = ''; datiStorico.forEach(row => { let dataDisp = row.data.includes('T') ? new Date(row.data).toLocaleDateString('it-IT') : row.data; let turnoDisp = formattaTurno(row.turno); const tr = document.createElement('tr'); tr.className = 'clickable-row'; tr.innerHTML = `<td>${dataDisp}</td><td>${row.reparto}</td><td>${turnoDisp}</td><td>${row.oreTotali}h</td>`; tr.onclick = () => { if(confirm("Caricare questo intervento?")) { document.getElementById('reparto').value = row.reparto; document.getElementById('turno').value = turnoDisp; try { attivita = JSON.parse(row.attivita || row.attivitaJson).map(a => ({ desc: a.first, ore: parseFloat(a.second.replace(',', '.')) })); renderLista(); } catch (e){} window.scrollTo(0,0); } }; tbody.appendChild(tr); }); status.innerText = "Dati aggiornati."; } catch (error) { status.innerText = "Errore sincronizzazione."; } }
